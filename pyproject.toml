[project]
name = "keystone-revocation"
version = "1.0.0"
description = "QuantumVault Zero-Trust PQC Architecture (Track 4: Key Identity Guard)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pqcrypto==0.4.0",
    "cryptography==46.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "coverage>=7.0.0",
    "bandit>=1.7.0",
]
web = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
]

[tool.bandit]
# Justification: assert statements in quantumvault/testing/ are test assertions inside the automated laboratory harness, not production logic.
exclude_dirs = ["quantumvault/testing", "tests", "tests_eval"]
skips = ["B101"]
